<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>PinkyPop • ร้านแอพพรีเมี่ยม</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;500;600;700&display=swap');
*{box-sizing:border-box}body{margin:0;font-family:Kanit,system-ui,sans-serif;background:linear-gradient(135deg,#f7f2ff,#eef8ff);color:#20234d}
.header{position:sticky;top:0;z-index:10;background:#ffffffee;backdrop-filter:blur(14px);border-bottom:1px solid #eee;display:flex;align-items:center;justify-content:space-between;padding:14px 5%}.brand{display:flex;gap:12px;align-items:center}.logo{width:52px;height:52px;border-radius:16px;display:grid;place-items:center;background:linear-gradient(135deg,#d9c5ff,#bdefff);font-size:28px}.brand b{font-size:23px}.brand small{display:block;color:#777}
.btn{border:0;border-radius:999px;padding:12px 20px;background:linear-gradient(135deg,#6f3df5,#4d8df7);color:white;font:inherit;cursor:pointer;box-shadow:0 7px 18px #5d55dc30}.wrap{width:min(1100px,92%);margin:auto}
.hero{margin:24px 0;border-radius:30px;padding:38px;min-height:300px;background:linear-gradient(135deg,#fff,#f4efff);border:1px solid #fff;box-shadow:0 16px 40px #7565b31c}.badge{display:inline-block;background:#fff;border:1px solid #ded4ff;color:#5c43bf;border-radius:999px;padding:7px 14px}h1{font-size:46px;margin:18px 0 5px}.hero p{font-size:19px;color:#686a86;margin:8px 0 24px}
.section-title{display:flex;align-items:end;justify-content:space-between;margin:32px 0 16px}.section-title h2{margin:0;font-size:28px}.muted{color:#85879d}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:16px}.card{background:#fff;border:1px solid #ece9f7;border-radius:24px;padding:14px;cursor:pointer;transition:.2s;box-shadow:0 8px 24px #4d55a00c}.card:hover{transform:translateY(-4px)}.icon{height:125px;border-radius:18px;display:grid;place-items:center;color:white;font-weight:700;font-size:30px}.card h3{margin:12px 3px 3px}.card small{color:#8a8ca0}
.bottom{position:sticky;bottom:12px;margin:30px auto 15px;width:min(680px,92%);background:#fffefeee;border:1px solid #e7e4ef;border-radius:24px;padding:8px;display:flex;justify-content:space-around;box-shadow:0 12px 30px #40406025;z-index:9}.nav{border:0;background:transparent;padding:10px 18px;border-radius:18px;font:inherit;color:#777;cursor:pointer}.nav.active{background:#eee8ff;color:#5d3fd0;font-weight:600}
.modal{position:fixed;inset:0;background:#17152b66;display:none;align-items:flex-end;justify-content:center;z-index:20}.modal.open{display:flex}.sheet{width:min(720px,100%);max-height:88vh;overflow:auto;background:white;border-radius:30px 30px 0 0;padding:25px}.close{float:right;border:0;background:#f1eff8;border-radius:50%;width:40px;height:40px;font-size:20px;cursor:pointer}
.options{display:grid;gap:10px;margin:18px 0}.option{display:flex;justify-content:space-between;align-items:center;border:2px solid #eee9f7;border-radius:17px;padding:14px;cursor:pointer}.option.selected{border-color:#9a79ff;background:#faf7ff}.price{color:#7444df;font-weight:700;font-size:20px}.qty{display:flex;align-items:center;gap:18px;margin:15px 0}.qty button{width:40px;height:40px;border:1px solid #ddd;border-radius:12px;background:white;font-size:22px}.cartline{display:flex;justify-content:space-between;border-bottom:1px solid #eee;padding:12px 0}.empty{padding:45px;text-align:center;color:#888}
@media(max-width:800px){.grid{grid-template-columns:repeat(2,1fr)}h1{font-size:35px}}@media(max-width:500px){.hero{padding:25px}.icon{height:100px;font-size:25px}}
</style></head>
<body>
<header class="header"><div class="brand"><div class="logo">🌷</div><div><b>PinkyPop</b><small>หารแอพพรีเมี่ยม</small></div></div><button class="btn" onclick="alert('ระบบสมัครสมาชิกตัวอย่าง')">สมัครสมาชิก</button></header>
<main class="wrap">
<section class="hero"><span class="badge">💜 เปิดให้บริการ</span><h1>ยินดีต้อนรับสู่ PinkyPop</h1><p>ร้านแอพพรีเมี่ยม 💜🩵<br>เลือกแพ็กเกจและจำนวนได้ง่าย พร้อมสั่งซื้อผ่านตะกร้า</p><button class="btn" onclick="document.getElementById('products').scrollIntoView({behavior:'smooth'})">เลือกสินค้า</button></section>
<div class="section-title"><h2 id="products">สินค้าทั้งหมด</h2><span class="muted">กดสินค้าเพื่อเลือกแพ็กเกจ</span></div><div class="grid" id="grid"></div>
<div class="section-title"><h2>ติดต่อร้าน</h2></div><div style="background:#fff;border-radius:24px;padding:20px;border:1px solid #eee9f7;margin-bottom:35px">💬 LINE: <b>@856slnwh</b> <button class="btn" style="float:right" onclick="location.href='https://line.me/R/ti/p/%40856slnwh'">ติดต่อ LINE</button></div>
</main>
<nav class="bottom"><button class="nav active" onclick="scrollTo({top:0,behavior:'smooth'})">⌂<br>หน้าร้าน</button><button class="nav" onclick="openCart()">🛒<br>ตะกร้า <span id="cartCount"></span></button><button class="nav" onclick="showHistory()">◷<br>ประวัติ</button><button class="nav" onclick="alert('PinkyPop • LINE @856slnwh')">▦<br>เมนู</button></nav>
<div class="modal" id="modal" onclick="if(event.target===this)closeModal()"><div class="sheet"><button class="close" onclick="closeModal()">×</button><div id="modalContent"></div></div></div>
<script>
const products={"Netflix": [["1 วัน ห้ามดูทีวี", 15], ["1 วัน ดูได้ทุกอุปกรณ์", 21], ["7 วัน ห้ามดูทีวี", 45], ["7 วัน ดูได้ทุกอุปกรณ์", 65], ["30 วัน ห้ามดูทีวี", 129], ["30 วัน ดูได้ทุกอุปกรณ์", 169]], "Disney+": [["7 วัน หาร4", 65], ["7 วัน หาร5", 59], ["30 วัน หาร4", 139], ["30 วัน หาร5", 125]], "Viu": [["7 วัน", 19], ["30 วัน", 35], ["60 วัน", 59], ["90 วัน", 69]], "WeTV": [["7 วัน หาร4", 25], ["30 วัน หาร4", 35], ["30 วัน หาร2", 69]], "iQIYI": [["Standard • 7 วัน หาร4", 29], ["Standard • 30 วัน หาร4", 39], ["Premium 4K • 7 วัน หาร4 (ไม่ชน)", 39], ["Premium 4K • 30 วัน หาร4 (ไม่ชน)", 69]], "HBO Max": [["Standard • 7 วัน หาร4", 39], ["Standard • 30 วัน หาร4", 79], ["Premium 4K • 7 วัน หาร5", 69], ["Premium 4K • 30 วัน หาร5", 89]], "OneD": [["7 วัน หาร4", 45], ["7 วัน หาร2", 69], ["30 วัน หาร4", 89], ["30 วัน หาร2", 120]]};const colors={"Netflix": "#e50914", "Disney+": "#263cff", "Viu": "#ffbd18", "WeTV": "#168cff", "iQIYI": "#20c65a", "HBO Max": "#303043", "OneD": "#7046e8"};
let cart=JSON.parse(localStorage.getItem('pinkyCart')||'[]'),history=JSON.parse(localStorage.getItem('pinkyHistory')||'[]'),current=null;
function render(){document.getElementById('grid').innerHTML=Object.keys(products).map(n=>`<article class="card" onclick='openProduct("${n.replace(/"/g,'\\"')}")'><div class="icon" style="background:${colors[n]}">${n}</div><h3>${n}</h3><small>กดเพื่อเลือกแพ็กเกจ</small></article>`).join('');updateCount()}
function openProduct(name){let opts=products[name];document.getElementById('modalContent').innerHTML='<h2>'+name+'</h2><p class="muted">เลือกแพ็กเกจที่ต้องการ</p><div class="options">'+opts.map((o,i)=>'<div class="option '+(i===0?'selected':'')+'" data-i="'+i+'" onclick="selectOption(this)"><span>'+o[0]+'</span><span class="price">'+o[1]+'฿</span></div>').join('')+'</div><div class="qty"><button onclick="changeQty(-1)">−</button><b id="qty">1</b><button onclick="changeQty(1)">+</button><span class="muted">จำนวน</span></div><button class="btn" style="width:100%" onclick="addCart()">เพิ่มลงตะกร้า</button>';document.getElementById('modal').classList.add('open');current={name:name,idx:0,qty:1}}
function selectOption(el){document.querySelectorAll('.option').forEach(x=>x.classList.remove('selected'));el.classList.add('selected');current.idx=+el.dataset.i}
function changeQty(n){current.qty=Math.max(1,current.qty+n);document.getElementById('qty').textContent=current.qty}
function addCart(){let o=products[current.name][current.idx];cart.push({name:current.name,option:o[0],price:o[1],qty:current.qty});localStorage.setItem('pinkyCart',JSON.stringify(cart));closeModal();updateCount();alert('เพิ่มลงตะกร้าแล้ว 💜')}
function updateCount(){document.getElementById('cartCount').textContent=cart.length?'('+cart.length+')':''}
function openCart(){let total=cart.reduce((s,x)=>s+x.price*x.qty,0);let body=cart.length?cart.map(x=>'<div class="cartline"><span>'+x.name+'<br><small>'+x.option+' × '+x.qty+'</small></span><b>'+x.price*x.qty+'฿</b></div>').join('')+'<h3 style="text-align:right">รวม '+total+'฿</h3><button class="btn" style="width:100%" onclick="checkout()">สั่งซื้อ</button>':'<div class="empty">ยังไม่มีสินค้าในตะกร้า 🛒</div>';document.getElementById('modalContent').innerHTML='<h2>🛒 ตะกร้าสินค้า</h2>'+body;document.getElementById('modal').classList.add('open')}
function checkout(){if(!cart.length)return;let total=cart.reduce((s,x)=>s+x.price*x.qty,0);history.push({date:new Date().toLocaleString('th-TH'),items:cart,total:total});localStorage.setItem('pinkyHistory',JSON.stringify(history));cart=[];localStorage.setItem('pinkyCart','[]');updateCount();document.getElementById('modalContent').innerHTML='<div class="empty"><h2>สั่งซื้อเรียบร้อย 💜</h2><p>ออเดอร์ถูกบันทึกไว้ในประวัติแล้ว</p><button class="btn" onclick="closeModal()">กลับหน้าร้าน</button></div>'}
function showHistory(){let body=history.length?history.slice().reverse().map(x=>'<div class="cartline"><span>'+x.date+'<br><small>'+x.items.length+' รายการ</small></span><b>'+x.total+'฿</b></div>').join(''):'<div class="empty">ยังไม่มีประวัติการสั่งซื้อ</div>';document.getElementById('modalContent').innerHTML='<h2>◷ ประวัติการสั่งซื้อ</h2>'+body;document.getElementById('modal').classList.add('open')}
function closeModal(){document.getElementById('modal').classList.remove('open')}render();
</script></body></html>
